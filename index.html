<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>샌드아트 생성기</title>
<style>
:root{
  --bg:#fff7dc;
  --paper:#fffaf0;
  --sand:#d9a94d;
  --sand2:#f0c96d;
  --deep:#7a5120;
  --ink:#4d3519;
  --muted:#8a7456;
  --line:#ead29e;
  --shadow:0 16px 36px rgba(122,81,32,.13);
  --radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 5%, rgba(255,227,137,.55), transparent 28%),
    radial-gradient(circle at 90% 10%, rgba(242,196,95,.28), transparent 24%),
    linear-gradient(180deg,#fff9e9,#fff2c7);
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:.24;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(116,77,22,.15) 0 1px, transparent 1.5px),
    radial-gradient(circle at 75% 70%, rgba(116,77,22,.11) 0 1px, transparent 1.5px);
  background-size:22px 22px, 31px 31px;
}
.wrap{width:min(1180px,92vw);margin:0 auto;padding:30px 0 50px}
.hero{
  background:rgba(255,250,240,.9);
  border:2px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:28px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"✦";
  position:absolute;right:24px;top:18px;
  font-size:3rem;color:#e4bc5c;transform:rotate(12deg);
}
.badge{
  display:inline-flex;gap:8px;align-items:center;
  padding:7px 12px;border-radius:999px;
  background:#fff0bd;border:1px solid #efd68d;
  color:#8a5b1f;font-weight:900;font-size:.85rem;
}
h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.05;margin:14px 0 10px;letter-spacing:-.055em}
.hero p{margin:0;color:var(--muted);line-height:1.75;max-width:760px}
.grid{display:grid;grid-template-columns:.88fr 1.12fr;gap:20px;margin-top:20px}
.panel{
  background:rgba(255,250,240,.94);
  border:2px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.panel h2{margin:0 0 14px;font-size:1.2rem}
.scenes{display:grid;gap:12px}
.scene-row{
  display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;
  padding:10px;border-radius:16px;background:#fffdf6;border:1px solid #f1dfb7;
}
.num{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:#ffe8a1;color:#7a5120;font-weight:950;
  border:1px solid #e7c56d;
}
textarea{
  width:100%;resize:vertical;min-height:68px;
  border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;line-height:1.55;padding:4px;
}
textarea:focus{background:#fff9e6;border-radius:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{
  border:0;border-radius:15px;padding:13px 17px;font-weight:900;font-size:.95rem;
  cursor:pointer;transition:.16s ease;
}
button:active{transform:translateY(2px) scale(.99)}
.primary{background:#9b6b24;color:white;box-shadow:0 7px 17px rgba(122,81,32,.18)}
.primary:hover{background:#805619}
.secondary{background:#ffe9a8;color:#774f1d;border:1px solid #edcd75}
.stage-card{display:flex;flex-direction:column}
.stage-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.stage-head small{color:var(--muted)}
.canvas-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  border-radius:22px;
  overflow:hidden;
  background:#f3c867;
  border:5px solid #fff4cc;
  box-shadow:inset 0 0 0 2px #c79135, 0 12px 26px rgba(122,81,32,.15);
}
canvas{width:100%;height:100%;display:block}
.caption{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(88%,760px);padding:10px 14px;border-radius:14px;
  background:rgba(78,49,15,.72);color:#fff8e7;text-align:center;
  font-weight:800;line-height:1.45;backdrop-filter:blur(4px);
}
.progress{
  margin-top:13px;height:10px;border-radius:999px;background:#f2dfb2;overflow:hidden
}
.progress > div{height:100%;width:0;background:linear-gradient(90deg,#e7b44f,#9b6b24);transition:width .25s linear}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:var(--muted);font-size:.85rem}
.note{
  margin-top:14px;padding:12px 14px;border-radius:15px;
  background:#fff8dc;border:1px dashed #dfbd68;color:#7c643e;font-size:.85rem;line-height:1.6
}
@media(max-width:850px){.grid{grid-template-columns:1fr}.canvas-wrap{aspect-ratio:4/3}}
@media(max-width:560px){
  .wrap{width:94vw;padding-top:16px}
  .hero,.panel{padding:16px}
  .actions button{width:100%}
  .caption{font-size:.84rem;bottom:10px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="badge">✋ 모래로 이어지는 이야기</div>
    <h1>샌드아트 생성기</h1>
    <p>최대 6개의 상황을 순서대로 입력하면, 문장 속 키워드를 바탕으로 모래가 흩어지고 모이며 장면이 바뀌는 샌드아트 애니메이션으로 재생합니다.</p>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>이야기 순서 입력</h2>
      <div id="sceneInputs" class="scenes"></div>
      <div class="actions">
        <button class="primary" id="playBtn">▶ 실행</button>
        <button class="secondary" id="stopBtn">■ 멈춤</button>
        <button class="secondary" id="resetBtn">↺ 예시 복원</button>
      </div>
      <div class="note">
        브라우저에서 동작하는 키워드 기반 샌드아트입니다. 사람·사막·오아시스·달리기·음식점·식사·웃음 등 주요 표현을 인식해 상징적인 모래 그림으로 표현합니다.
      </div>
    </div>

    <div class="panel stage-card">
      <div class="stage-head">
        <h2>샌드아트 무대</h2>
        <small id="statusText">대기 중</small>
      </div>
      <div class="canvas-wrap">
        <canvas id="sandCanvas" width="960" height="600"></canvas>
        <div class="caption" id="caption">실행 버튼을 누르면 이야기가 시작됩니다.</div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="meta">
        <span id="sceneCount">장면 0 / 0</span>
        <span>따뜻한 샌드 톤 애니메이션</span>
      </div>
    </div>
  </section>
</main>

<script>
const examples = [
  "사막에 한 사람이 쓸쓸히 걸어가고 있어",
  "갑자기 오아시스가 나타나고 사람이 이것을 발견해",
  "그 사람 눈이 커지고 오아시스로 달려가",
  "오아시스 물을 마시는데 갑자기 멋진 음식점으로 변해",
  "근사한 옷을 입고 그 음식점에서 식사를 해",
  "행복한 웃음으로 마무리"
];

const inputBox = document.getElementById("sceneInputs");
const canvas = document.getElementById("sandCanvas");
const ctx = canvas.getContext("2d");
const caption = document.getElementById("caption");
const statusText = document.getElementById("statusText");
const progressBar = document.getElementById("progressBar");
const sceneCount = document.getElementById("sceneCount");
let playing = false;
let raf = null;
let sceneToken = 0;

function buildInputs(){
  inputBox.innerHTML="";
  examples.forEach((text,i)=>{
    const row=document.createElement("div");
    row.className="scene-row";
    row.innerHTML=`<div class="num">${i+1}</div><textarea maxlength="120" placeholder="${i+1}번째 상황을 입력하세요">${text}</textarea>`;
    inputBox.appendChild(row);
  });
}
buildInputs();

function getScenes(){
  return [...document.querySelectorAll("textarea")].map(x=>x.value.trim()).filter(Boolean);
}

function resizeCanvasForDPR(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(rect.width*dpr);
  canvas.height=Math.floor(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:rect.width,h:rect.height};
}

function sandBackground(w,h,t=0){
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#f7d87c");
  g.addColorStop(1,"#ddb05a");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  ctx.globalAlpha=.16;
  ctx.fillStyle="#7a5120";
  for(let i=0;i<360;i++){
    const x=(Math.sin(i*12.9898+t*.0003)*43758.5453)%1;
    const y=(Math.sin(i*78.233+t*.0005)*12345.678)%1;
    const px=Math.abs(x)*w, py=Math.abs(y)*h;
    ctx.beginPath(); ctx.arc(px,py,(i%3)*.35+.45,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function dune(w,h,offset=0){
  ctx.strokeStyle="#9d6b27";ctx.lineWidth=3;ctx.globalAlpha=.78;
  ctx.beginPath();
  ctx.moveTo(0,h*.72);
  ctx.quadraticCurveTo(w*.28,h*.57+offset,w*.52,h*.72);
  ctx.quadraticCurveTo(w*.76,h*.86-offset,w,h*.66);
  ctx.stroke();
  ctx.globalAlpha=1;
}

function person(x,y,s=1,pose="walk"){
  ctx.strokeStyle="#5d3b17";ctx.fillStyle="#5d3b17";ctx.lineCap="round";
  ctx.lineWidth=4*s;
  ctx.beginPath();ctx.arc(x,y-36*s,9*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y-26*s);ctx.lineTo(x,y+10*s);ctx.stroke();
  ctx.beginPath();
  if(pose==="run"){ctx.moveTo(x,y-12*s);ctx.lineTo(x+20*s,y-2*s);ctx.moveTo(x,y-12*s);ctx.lineTo(x-15*s,y+4*s)}
  else {ctx.moveTo(x,y-12*s);ctx.lineTo(x+14*s,y);ctx.moveTo(x,y-12*s);ctx.lineTo(x-12*s,y+2*s)}
  ctx.stroke();
  ctx.beginPath();
  if(pose==="run"){ctx.moveTo(x,y+10*s);ctx.lineTo(x+20*s,y+27*s);ctx.moveTo(x,y+10*s);ctx.lineTo(x-18*s,y+22*s)}
  else {ctx.moveTo(x,y+10*s);ctx.lineTo(x+12*s,y+28*s);ctx.moveTo(x,y+10*s);ctx.lineTo(x-10*s,y+28*s)}
  ctx.stroke();
}

function oasis(w,h,a=1){
  ctx.globalAlpha=a;
  ctx.fillStyle="#8a611f";
  ctx.beginPath();ctx.ellipse(w*.72,h*.70,85,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f1d78c";
  ctx.beginPath();ctx.ellipse(w*.72,h*.69,70,15,0,0,Math.PI*2);ctx.fill();
  palm(w*.78,h*.63,.9); palm(w*.66,h*.65,.7);
  ctx.globalAlpha=1;
}
function palm(x,y,s){
  ctx.strokeStyle="#5b3b18";ctx.lineWidth=4*s;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-4*s,y-40*s,x+3*s,y-74*s);ctx.stroke();
  for(let i=0;i<6;i++){
    const a=(-Math.PI*.9)+(i/5)*Math.PI*1.8;
    ctx.beginPath();ctx.moveTo(x+3*s,y-74*s);ctx.lineTo(x+Math.cos(a)*35*s,y-74*s+Math.sin(a)*18*s);ctx.stroke();
  }
}
function restaurant(w,h,a=1){
  ctx.globalAlpha=a;
  const x=w*.58,y=h*.34,ww=w*.30,hh=h*.38;
  ctx.strokeStyle="#5f3d18";ctx.lineWidth=4;
  ctx.strokeRect(x,y,ww,hh);
  ctx.beginPath();ctx.moveTo(x-10,y);ctx.lineTo(x+ww/2,y-50);ctx.lineTo(x+ww+10,y);ctx.stroke();
  ctx.fillStyle="#5f3d18";ctx.fillRect(x+ww*.42,y+hh*.48,ww*.16,hh*.52);
  ctx.font="700 18px sans-serif";ctx.textAlign="center";ctx.fillText("RESTAURANT",x+ww/2,y+34);
  ctx.globalAlpha=1;
}
function tableMeal(w,h,a=1){
  ctx.globalAlpha=a;
  ctx.strokeStyle="#5d3b17";ctx.fillStyle="#5d3b17";ctx.lineWidth=4;
  const cy=h*.67;
  ctx.beginPath();ctx.moveTo(w*.56,cy);ctx.lineTo(w*.86,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*.60,cy);ctx.lineTo(w*.58,cy+55);ctx.moveTo(w*.82,cy);ctx.lineTo(w*.84,cy+55);ctx.stroke();
  ctx.beginPath();ctx.arc(w*.71,cy-8,18,0,Math.PI);ctx.stroke();
  person(w*.48,cy-22,.9,"walk");
  ctx.globalAlpha=1;
}
function smile(w,h,a=1){
  ctx.globalAlpha=a; ctx.strokeStyle="#5c3a16";ctx.lineWidth=7;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(w*.5,h*.46,85,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(w*.47,h*.43,5,0,Math.PI*2);ctx.fillStyle="#5c3a16";ctx.fill();
  ctx.beginPath();ctx.arc(w*.53,h*.43,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*.5,h*.47,42,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.globalAlpha=1;
}
function bigEyes(x,y,a=1){
  ctx.globalAlpha=a;ctx.strokeStyle="#5d3b17";ctx.lineWidth=3;
  [-12,12].forEach(dx=>{ctx.beginPath();ctx.arc(x+dx,y,8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x+dx,y,2.5,0,Math.PI*2);ctx.fillStyle="#5d3b17";ctx.fill();});
  ctx.globalAlpha=1;
}

function classify(text){
  const t=text.toLowerCase();
  if(/웃음|행복|미소|웃어/.test(t)) return "smile";
  if(/음식점|식당|레스토랑/.test(t) && /식사|먹/.test(t)) return "meal";
  if(/음식점|식당|레스토랑/.test(t)) return "restaurant";
  if(/달려|달리/.test(t)) return "run";
  if(/오아시스/.test(t)) return "oasis";
  if(/사막|걷|걸어/.test(t)) return "desert";
  return "generic";
}

function drawScene(type,p,text,w,h,time){
  sandBackground(w,h,time);
  dune(w,h,Math.sin(time*.002)*6);
  const appear=Math.min(1,p*1.6);
  if(type==="desert"){
    const x=w*.18 + p*w*.34;
    person(x,h*.61,1.05,"walk");
    ctx.globalAlpha=.5;ctx.fillStyle="#6c471c";ctx.font="700 24px sans-serif";ctx.fillText("∙  ∙  ∙",x-65,h*.72);ctx.globalAlpha=1;
  } else if(type==="oasis"){
    person(w*.34,h*.62,1,"walk");
    oasis(w,h,appear);
  } else if(type==="run"){
    const x=w*.25+p*w*.28;
    person(x,h*.63,1.05,"run");
    oasis(w,h,1);
    bigEyes(x,h*.63-42,Math.min(1,p*2));
  } else if(type==="restaurant"){
    oasis(w,h,Math.max(0,1-p*1.3));
    restaurant(w,h,Math.min(1,p*1.5));
    person(w*.43,h*.63,.95,"walk");
  } else if(type==="meal"){
    restaurant(w,h,.55);
    tableMeal(w,h,appear);
  } else if(type==="smile"){
    smile(w,h,appear);
    ctx.font="900 34px sans-serif";ctx.textAlign="center";ctx.fillStyle="#6b451b";ctx.fillText("THE END",w*.5,h*.72);
  } else {
    ctx.strokeStyle="#68451d";ctx.lineWidth=4;ctx.font="700 22px sans-serif";ctx.textAlign="center";
    ctx.strokeRect(w*.28,h*.30,w*.44,h*.30);
    ctx.fillStyle="#68451d";ctx.fillText("이 장면을 모래로 상상해 보세요",w*.5,h*.47);
    person(w*.20,h*.68,.9,"walk");
  }

  // 흩날리는 모래 입자
  ctx.fillStyle="#7a5120";
  ctx.globalAlpha=.28*(1-Math.abs(.5-p)*1.4);
  for(let i=0;i<90;i++){
    const px=(i*83+time*.05)%w;
    const py=(Math.sin(i*3.1+time*.002)*.5+.5)*h;
    ctx.beginPath();ctx.arc(px,py,1+(i%3)*.4,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function play(){
  const scenes=getScenes();
  if(!scenes.length){alert("상황을 하나 이상 입력해주세요.");return;}
  playing=true; sceneToken++; const token=sceneToken;
  document.getElementById("playBtn").disabled=true;
  progressBar.style.width="0%";
  const total=scenes.length;

  for(let i=0;i<total;i++){
    if(!playing || token!==sceneToken) break;
    const text=scenes[i];
    const type=classify(text);
    caption.textContent=text;
    statusText.textContent=`${i+1}번째 장면 재생 중`;
    sceneCount.textContent=`장면 ${i+1} / ${total}`;

    const duration=4200;
    const start=performance.now();

    await new Promise(resolve=>{
      function frame(now){
        if(!playing || token!==sceneToken){resolve();return;}
        const p=Math.min(1,(now-start)/duration);
        const {w,h}=resizeCanvasForDPR();
        drawScene(type,p,text,w,h,now);
        const all=((i+p)/total)*100;
        progressBar.style.width=all+"%";
        if(p<1){raf=requestAnimationFrame(frame)}else resolve();
      }
      raf=requestAnimationFrame(frame);
    });
    await sleep(450);
  }

  if(playing && token===sceneToken){
    statusText.textContent="재생 완료";
    progressBar.style.width="100%";
  }
  playing=false;
  document.getElementById("playBtn").disabled=false;
}

function stop(){
  playing=false;sceneToken++;
  if(raf) cancelAnimationFrame(raf);
  statusText.textContent="멈춤";
  document.getElementById("playBtn").disabled=false;
}

document.getElementById("playBtn").addEventListener("click",()=>{stop();setTimeout(play,50)});
document.getElementById("stopBtn").addEventListener("click",stop);
document.getElementById("resetBtn").addEventListener("click",()=>{
  stop();
  [...document.querySelectorAll("textarea")].forEach((el,i)=>el.value=examples[i]);
  caption.textContent="실행 버튼을 누르면 이야기가 시작됩니다.";
  sceneCount.textContent="장면 0 / 0";progressBar.style.width="0%";
  const {w,h}=resizeCanvasForDPR();sandBackground(w,h,0);dune(w,h,0);
});

window.addEventListener("resize",()=>{
  if(!playing){const {w,h}=resizeCanvasForDPR();sandBackground(w,h,0);dune(w,h,0);}
});
const initial=resizeCanvasForDPR();sandBackground(initial.w,initial.h,0);dune(initial.w,initial.h,0);
</script>
</body>
</html>
